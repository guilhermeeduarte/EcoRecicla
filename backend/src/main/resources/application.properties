spring.application.name=ecorecicla

# MySQL database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ecorecicla?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# URLs de dados abertos para importação automática ou manual
open-data.snis.url=
open-data.mma.url=

server.port=8080

cors.allowed-origins=http://localhost:5173,http://localhost:3000